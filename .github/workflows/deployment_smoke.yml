name: Deployment smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  docker-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build deployment image
        run: docker build --tag financial-engine:smoke .

      - name: Start container and check health endpoint
        run: |
          docker run --detach --name financial-engine-smoke -p 8000:8000 -e PORT=8000 financial-engine:smoke
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health; then
              echo
              docker stop financial-engine-smoke
              exit 0
            fi
            if [ "$(docker inspect --format='{{.State.Running}}' financial-engine-smoke)" != "true" ]; then
              break
            fi
            sleep 2
          done
          docker logs financial-engine-smoke || true
          exit 1
