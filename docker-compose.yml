version: '3.8'

services:
  financial-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financial-engine
    ports:
      - "8000:8000"
    volumes:
      - ./client_inbox:/app/client_inbox
      - ./client_outbox:/app/client_outbox
      - ./outputs:/app/outputs
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    restart: unless-stopped
